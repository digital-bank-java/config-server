name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Maven verification
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Java
              uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Verify application
              run: ./mvnw --batch-mode --no-transfer-progress verify

    helm:
        name: Helm validation
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Helm
              uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
              with:
                  version: v4.2.0

            - name: Lint chart
              run: helm lint helm --strict --values helm/values-sit.yaml

            - name: Render chart
              run: |
                  helm template config-server helm \
                    --namespace digital-bank-sit \
                    --values helm/values-sit.yaml \
                    --set image.tag="${GITHUB_SHA}" \
                    > rendered.yaml
                  test -s rendered.yaml
    container:
        name: Container build and smoke test
        needs:
            - test
            - helm
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

            - name: Build container image
              uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
              with:
                  context: .
                  load: true
                  push: false
                  tags: digital-bank-java/config-server:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test container
              shell: bash
              run: |
                  config_repo_fixture="$(mktemp -d)"
                  cp -R src/test/resources/config-repo/. "${config_repo_fixture}/"
                  git -C "${config_repo_fixture}" init --initial-branch=main
                  git -C "${config_repo_fixture}" config user.name "Config Server CI"
                  git -C "${config_repo_fixture}" config user.email "config-server-ci@localhost"
                  git -C "${config_repo_fixture}" add .
                  git -C "${config_repo_fixture}" commit --message "Create CI configuration fixture"
                  chmod -R a+rwX "${config_repo_fixture}"

                  cleanup() {
                    docker rm --force config-server-ci > /dev/null 2>&1 || true
                    rm -rf "${config_repo_fixture}"
                  }
                  trap cleanup EXIT

                  docker run --detach \
                    --name config-server-ci \
                    --publish 8888:8888 \
                    --env CONFIG_REPO_URI=file:/platform-config \
                    --env CONFIG_REPO_DEFAULT_LABEL=main \
                    --volume "${config_repo_fixture}:/platform-config" \
                    digital-bank-java/config-server:ci

                  ready=false
                  for attempt in {1..30}; do
                    if curl --fail --silent \
                      http://localhost:8888/actuator/health/liveness > /dev/null; then
                      ready=true
                      break
                    fi
                    sleep 2
                  done

                  if [[ "${ready}" != "true" ]]; then
                    docker logs config-server-ci
                    exit 1
                  fi

                  curl --fail --silent \
                    http://localhost:8888/test-service/default \
                    | grep --quiet '"test.message":"config-server-integration-test"'
