server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        accept-empty: false
        git:
          uri: "${CONFIG_REPO_URI:file:../config-repo}"
          default-label: "${CONFIG_REPO_DEFAULT_LABEL:main}"
          try-master-branch: false
          search-paths:
            - "{application}"
          clone-on-start: true
          force-pull: true
          delete-untracked-branches: true
          timeout: 10
          username: "${CONFIG_REPO_USERNAME:}"
          password: "${CONFIG_REPO_TOKEN:}"
        health:
          repositories:
            config-repo:
              name: customer-service
              profiles: local
              label: "${CONFIG_REPO_DEFAULT_LABEL:main}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true